<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- head -->
  <rect x="3" y="4" width="10" height="8" rx="2" fill="currentColor" opacity="0.9"/>
  <!-- eyes -->
  <circle cx="5.5" cy="8" r="1" fill="#000" opacity="0.6"/>
  <circle cx="10.5" cy="8" r="1" fill="#000" opacity="0.6"/>
  <!-- antenna -->
  <line x1="8" y1="4" x2="8" y2="1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="8" cy="1.5" r="0.8" fill="currentColor"/>
  <!-- mouth -->
  <rect x="5.5" y="10" width="5" height="1" rx="0.5" fill="#000" opacity="0.5"/>
</svg>
